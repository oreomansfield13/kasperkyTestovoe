services:
  db:
    image: postgres:16-alpine
    container_name: threat_db
    environment:
      POSTGRES_USER: threat_user
      POSTGRES_PASSWORD: threat_password
      POSTGRES_DB: threat_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threat_user -d threat_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: threat_app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - STORAGE=postgres
      - DATABASE_URL=postgres://threat_user:threat_password@db:5432/threat_db?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: